name: Release Please

on:
  push:
    branches:
      - main

# Each job asks for what it needs: only release-please and the final upload can write.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  WIX_VERSION_TAG: wix3141rtm
  WIX_ZIP_SHA256: 6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-msi:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_created == true }}
    runs-on: windows-latest
    # Builds with a read-only token and no build cache (a release is built clean); the MSI is
    # attached and the draft release published by publish-msi.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches the workspace version
        shell: pwsh
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $pkg = $meta.packages | Where-Object { $_.name -eq 'negotium' }
          if (-not $pkg) { throw "package 'negotium' not found in cargo metadata" }
          $expected = "v$($pkg.version)"
          if ($env:TAG -ne $expected) {
            throw "Tag '$env:TAG' does not match the workspace version (expected '$expected')."
          }
          Write-Host "Tag $env:TAG matches version $($pkg.version)"
          "VERSION=$($pkg.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # negotium.exe is built in release mode for packaging. Tests are validated by CI.
      - name: Build release
        run: cargo build --release -p negotium

      - name: Check the release exe imports no Visual C++ runtime
        shell: pwsh
        run: ./.github/scripts/check-imports.ps1 target/release/negotium.exe

      - name: Install WiX Toolset v3.14
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wix314'
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/$env:WIX_VERSION_TAG/wix314-binaries.zip" -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $env:WIX_ZIP_SHA256) {
            throw "WiX archive SHA-256 mismatch: expected $env:WIX_ZIP_SHA256, got $actual"
          }
          Expand-Archive -Path $zip -DestinationPath $dir
          foreach ($exe in 'candle.exe', 'light.exe') {
            if (-not (Test-Path (Join-Path $dir $exe))) { throw "$exe missing from the WiX archive" }
          }
          "WIX_BIN=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Built from crates.io with its lockfile, not a prebuilt binary.
      - name: Install cargo-wix
        run: cargo install cargo-wix --locked --version 0.3.9

      - name: Build the MSI
        run: cargo wix -p negotium --bin-path "$env:WIX_BIN" --no-build --nocapture

      - name: Locate the MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/wix -Filter '*.msi'
          if ($msi.Count -ne 1) { throw "expected exactly one MSI in target/wix, found $($msi.Count)" }
          $expected = "negotium-$env:VERSION-x86_64.msi"
          if ($msi[0].Name -ne $expected) { throw "unexpected MSI name $($msi[0].Name), expected $expected" }
          "MSI_PATH=$($msi[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: ${{ env.MSI_PATH }}
          if-no-files-found: error
          retention-days: 1

  # release-please creates the release as a draft (release-please-config.json): it is published
  # only once its MSI is attached, so the updater never sees a latest release without one.
  publish-msi:
    needs: [release-please, build-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: msi
          path: msi

      - name: Upload the MSI and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(msi/*.msi)
          if [ "${#files[@]}" -ne 1 ]; then echo "expected exactly one MSI, found ${#files[@]}" >&2; exit 1; fi
          gh release upload "$TAG" "${files[0]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Uploaded ${files[0]} to release $TAG and published it"
