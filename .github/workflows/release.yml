name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  WIX_VERSION_TAG: wix3141rtm
  WIX_ZIP_SHA256: 6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches the workspace version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $pkg = $meta.packages | Where-Object { $_.name -eq 'negotium' }
          if (-not $pkg) { throw "package 'negotium' not found in cargo metadata" }
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$env:TAG' is not of the form vX.Y.Z"
          }
          $expected = "v$($pkg.version)"
          if ($env:TAG -ne $expected) {
            throw "Tag '$env:TAG' does not match the workspace version (expected '$expected'). Bump the version in Cargo.toml or retag."
          }
          Write-Host "Tag $env:TAG matches version $($pkg.version)"
          "VERSION=$($pkg.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # busy_child_reports_one_core_of_cpu is timing-sensitive under load (known
      # flaky, listed in the plan's follow-ups); it must not block releases.
      - name: Test
        run: cargo test --workspace --no-fail-fast -- --skip busy_child_reports_one_core_of_cpu

      - name: Build release
        run: cargo build --release -p negotium

      # The MSI ships only negotium.exe: it must not need the Visual C++ Redistributable.
      - name: Check the release exe imports no Visual C++ runtime
        shell: pwsh
        run: ./.github/scripts/check-imports.ps1 target/release/negotium.exe

      - name: Install WiX Toolset v3.14
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wix314'
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/$env:WIX_VERSION_TAG/wix314-binaries.zip" -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $env:WIX_ZIP_SHA256) {
            throw "WiX archive SHA-256 mismatch: expected $env:WIX_ZIP_SHA256, got $actual"
          }
          Expand-Archive -Path $zip -DestinationPath $dir
          foreach ($exe in 'candle.exe', 'light.exe') {
            if (-not (Test-Path (Join-Path $dir $exe))) { throw "$exe missing from the WiX archive" }
          }
          "WIX_BIN=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Build the MSI
        run: cargo wix -p negotium --bin-path "$env:WIX_BIN" --no-build --nocapture

      - name: Locate the MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/wix -Filter '*.msi'
          if ($msi.Count -ne 1) { throw "expected exactly one MSI in target/wix, found $($msi.Count)" }
          $expected = "negotium-$env:VERSION-x86_64.msi"
          if ($msi[0].Name -ne $expected) { throw "unexpected MSI name $($msi[0].Name), expected $expected" }
          "MSI_PATH=$($msi[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Only a release this step created is ever deleted: re-running for a tag that already
          # has a release (published, which the updater reads, or a draft) fails without touching
          # it. Any failure once this step's draft may exist (a create that failed uploading the
          # asset included) deletes that draft, keeping the tag, so re-running starts clean.
          $probe = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "a release for $env:TAG already exists ($probe); not touching it: delete a stale draft by hand before re-running"
          }
          if ("$probe" -notmatch 'release not found') {
            throw "could not check for an existing release for ${env:TAG}: $probe"
          }
          try {
            gh release create $env:TAG $env:MSI_PATH --repo $env:GITHUB_REPOSITORY --draft --title $env:TAG --notes "Negotium $env:TAG. Install with the attached MSI (per-machine, Windows 64-bit)."
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
            $assets = (gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets
            if ($LASTEXITCODE -ne 0) { throw "gh release view failed" }
            $msis = @($assets | Where-Object { $_.name -like '*.msi' })
            if ($msis.Count -ne 1 -or @($assets).Count -ne 1) {
              throw "draft release must have exactly one asset, an .msi; found $(@($assets).Count) assets"
            }
            # --latest: the updater reads /releases/latest.
            gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
          } catch {
            # No release existed before the create, so one there now is this step's; delete it
            # only while it is still a draft (never a published release).
            $view = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
            if ($LASTEXITCODE -eq 0 -and ($view | ConvertFrom-Json).isDraft -eq $true) {
              gh release delete $env:TAG --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag=false
              if ($LASTEXITCODE -ne 0) { Write-Warning "deleting the draft release $env:TAG failed: delete it before re-running" }
            } elseif ($LASTEXITCODE -eq 0) {
              Write-Warning "release $env:TAG is published; not deleting it"
            } else {
              Write-Warning "no draft release $env:TAG was found to delete"
            }
            throw
          }
