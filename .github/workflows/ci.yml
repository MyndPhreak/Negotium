name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests marked #[ignore] need an elevated terminal and are not run here.
      # The Slint UI tests use the testing backend and run headless.
      # busy_child_reports_one_core_of_cpu is timing-sensitive under load (known
      # flaky, listed in the plan's follow-ups); it must not block CI.
      - name: Test
        run: cargo test --workspace -- --skip busy_child_reports_one_core_of_cpu
