name: CI

# A PR branch runs once, through pull_request; push runs only for main (after a merge).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Only main saves the cache: every branch can restore main's, and PR branches neither pay
      # for the upload nor push main's cache out of the repository's 10 GB limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests marked #[ignore] need an elevated terminal and are not run here.
      # The Slint UI tests use the testing backend and run headless.
      # busy_child_reports_one_core_of_cpu is timing-sensitive under load (known
      # flaky, listed in the plan's follow-ups); it must not block CI.
      - name: Test
        run: cargo test --workspace --no-fail-fast -- --skip busy_child_reports_one_core_of_cpu
      # The MSI ships only negotium.exe: it must not need the Visual C++ Redistributable.
      # Checked on main only (a release build takes minutes); release-please.yml checks again
      # before it builds the MSI, so an installer can never ship with the runtime import.
      - name: Build release
        if: github.event_name == 'push'
        run: cargo build --release -p negotium
      - name: Check the release exe imports no Visual C++ runtime
        if: github.event_name == 'push'
        shell: pwsh
        run: ./.github/scripts/check-imports.ps1 target/release/negotium.exe
