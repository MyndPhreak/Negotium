[package]
name = "negotium"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
negotium-snapshot.workspace = true
negotium-collector.workspace = true
negotium-model.workspace = true
negotium-history.workspace = true
negotium-actions.workspace = true
slint.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing = { workspace = true, features = ["renderer-software"] }
