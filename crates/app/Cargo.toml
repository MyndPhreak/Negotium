[package]
name = "negotium"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
negotium-snapshot.workspace = true
negotium-collector.workspace = true
negotium-model.workspace = true
negotium-history.workspace = true
negotium-actions.workspace = true
slint.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_UI_HiDpi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing = { workspace = true, features = ["renderer-software"] }
# tests/wix.rs reads the installer source (already in the lock through Slint).
roxmltree = "0.21.1"

# The installer: `cargo wix -p negotium` (WiX Toolset v3) builds wix/main.wxs. ICE43 and ICE57
# assume a per-user install (a Start menu shortcut in a component keyed by a file in Program
# Files); this one is per-machine (ALLUSERS=1), where the Start menu folder is the machine's.
# Re-check both suppressions whenever main.wxs's components change: they hide every ICE43/ICE57
# finding, not only this one.
[package.metadata.wix]
linker-args = ["-sice:ICE43", "-sice:ICE57"]
