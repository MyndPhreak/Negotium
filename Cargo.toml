[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.4.0"
license = "MIT"
publish = false

[workspace.dependencies]
negotium-snapshot = { path = "crates/snapshot" }
negotium-collector = { path = "crates/collector" }
negotium-actions = { path = "crates/actions" }
negotium-moderator = { path = "crates/moderator" }
negotium-model = { path = "crates/model" }
negotium-history = { path = "crates/history" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
windows = "0.62.2"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
slint-build = "1.18.1"
i-slint-backend-testing = "1.18.1"
raw-window-handle = "0.6.2"

[profile.release]
lto = "thin"
codegen-units = 1
