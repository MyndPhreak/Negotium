[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
negotium-snapshot = { path = "crates/snapshot" }
negotium-collector = { path = "crates/collector" }
negotium-actions = { path = "crates/actions" }
negotium-model = { path = "crates/model" }
negotium-history = { path = "crates/history" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
windows = "0.62.2"

[profile.release]
lto = "thin"
codegen-units = 1
